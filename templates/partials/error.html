<!-- Error Alert Card -->
<div class="bg-rose-950/50 border border-rose-800/80 rounded-xl p-5 text-rose-200 shadow-lg flex items-start space-x-3">
  <div class="w-8 h-8 rounded-lg bg-rose-900/60 flex items-center justify-center text-rose-300 shrink-0">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
    </svg>
  </div>
  <div class="space-y-1">
    <h4 class="font-bold text-sm text-rose-100">Unable to Calculate Route</h4>
    <p class="text-xs text-rose-300">{{ error_message }}</p>
    {% if details %}
    <p class="text-[11px] text-rose-400 font-mono bg-rose-950/80 p-2 rounded border border-rose-900 mt-2">
      {{ details }}
    </p>
    {% endif %}
  </div>
</div>
