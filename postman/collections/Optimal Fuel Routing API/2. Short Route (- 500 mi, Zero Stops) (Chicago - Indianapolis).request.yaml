$kind: http-request
name: 2. Short Route (< 500 mi, Zero Stops) (Chicago -> Indianapolis)
description: Route of ~180 miles. Since vehicle starts with a full tank (500 miles range), zero fuel stops are required and total_cost is $0.00.
url: "{{base_url}}/api/route/"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "start": "Chicago, IL",
      "finish": "Indianapolis, IN"
    }
order: 2000
